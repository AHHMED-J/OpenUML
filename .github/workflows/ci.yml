name: CI

# Every pull request into main (including Dependabot's) is typechecked, tested and checked for
# unused code before it can be merged. Installers are built only by the Release workflow.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read-only: the checks never write to the repository.
permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same Node as the release builds; no dependency cache (installs from the lockfile).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint:unused
